{% extends "notice/base.html" %}
{% block title %} {{ page_title }} {% endblock %}

{% block content %}
    <div>
        <a href="{% url 'notice:notice_list' %}">
            ← назад к объявлениям
        </a>
    </div>

    <article>
        <h1>{{ notice.title }}</h1>
        <div>
            {{ notice.created_at|date:"d.m.Y H:i" }}
        </div>
        <div>
            {{ notice.content }}
        </div>
    </article>
{% endblock %}
